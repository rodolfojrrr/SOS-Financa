name: Build Android

'on':
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: '29.0.14206865'
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK e NDK Android
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'build-tools;36.0.0' \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Preparar Rust e alvos Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Testar regras financeiras
        run: node tests/finance.test.js

      - name: Testar armazenamento da prévia
        run: node tests/storage.test.js

      - name: Testar estrutura SQLite
        run: python3 tests/schema_test.py

      - name: Testar configuração de release
        run: python3 tests/release_test.py

      - name: Inicializar projeto Android
        run: cargo tauri android init --ci --skip-targets-install

      - name: Preparar assinatura Release quando configurada
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEY_BASE64" && -n "$ANDROID_KEY_PASSWORD" && -n "$ANDROID_KEY_ALIAS" ]]; then
            echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/sos-financa-release.jks"
            {
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "password=$ANDROID_KEY_PASSWORD"
              echo "storeFile=$RUNNER_TEMP/sos-financa-release.jks"
            } > src-tauri/gen/android/keystore.properties
            python3 scripts/configure_android_signing.py
            echo "ANDROID_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "Secrets de assinatura nao configurados; sera gerado APK DEBUG para teste."
            echo "ANDROID_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Gerar APK Android Release assinado
        if: env.ANDROID_SIGNED == 'true'
        run: cargo tauri android build --apk --ci

      - name: Gerar APK Android de teste
        if: env.ANDROID_SIGNED != 'true'
        run: cargo tauri android build --debug --apk --ci

      - name: Publicar APK Release
        if: env.ANDROID_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SOS-Financa-Android-Release
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publicar APK de teste
        if: env.ANDROID_SIGNED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SOS-Financa-Android-TESTE
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
