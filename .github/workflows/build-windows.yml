name: Build Windows

'on':
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Preparar Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Instalar Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked
      - name: Testar regras financeiras
        run: node tests/finance.test.js
      - name: Testar armazenamento da prévia
        run: node tests/storage.test.js
      - name: Testar estrutura SQLite
        run: python tests/schema_test.py
      - name: Testar configuração de release
        run: python tests/release_test.py
      - name: Gerar instalador
        run: cargo tauri build
      - name: Publicar instalador NSIS
        uses: actions/upload-artifact@v4
        with:
          name: SOS-Financa-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
