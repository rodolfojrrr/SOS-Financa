name: Build Windows

'on':
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Preparar Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Instalar Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Testar regras financeiras
        run: node tests/finance.test.js
      - name: Testar armazenamento da prévia
        run: node tests/storage.test.js
      - name: Gerar instalador
        run: cargo tauri build
      - name: Publicar instalador NSIS
        uses: actions/upload-artifact@v4
        with:
          name: SOS-Financa-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
